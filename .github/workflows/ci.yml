name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import knowledge base
        run: npm run import:bottobot

      - name: Test
        run: npm test

  build-package:
    name: Build and MCPB Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import knowledge base
        run: npm run import:bottobot

      - name: Build
        run: npm run build

      - name: Build .mcpb bundle
        run: npm run build:mcpb

      - name: Upload .mcpb artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tdmcp-mcpb
          path: "*.mcpb"
          if-no-files-found: error

  bridge-tests:
    name: Python Bridge Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Test bridge
        run: python3 -m unittest discover -s td/tests

  raw-exec-off-smoke:
    name: Raw Exec OFF Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js 22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke
        env:
          TDMCP_RAW_PYTHON: "off"
        run: node scripts/run-vitest.mjs run tests/smoke/execOff.test.ts

  bridge-exec-off-smoke:
    # G4: every Layer 1/2 tool against a mocked bridge that refuses what a real
    # TDMCP_BRIDGE_ALLOW_EXEC=0 bridge refuses, ratcheted against a baseline. Offline:
    # no TouchDesigner, default tool paths only, so it cannot prove live behavior.
    name: Bridge Exec OFF Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # The shrink-only guard reads the baseline at the PR's base commit.
          fetch-depth: 0

      - name: Use Node.js 22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import knowledge base
        run: npm run import:bottobot

      - name: Smoke
        run: npm run smoke:exec-off

      - name: Baseline may only shrink
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXEC_OFF_ALLOW_GROWTH: ${{ contains(github.event.pull_request.labels.*.name, 'exec-off-baseline-growth') && '1' || '0' }}
        run: node scripts/check-exec-off-baseline.mjs "$BASE_SHA"

  creative-rag-multilingual-smoke:
    name: Creative RAG Multilingual Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js 22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import knowledge base
        run: npm run import:bottobot

      - name: Smoke index with swapped embedding model
        env:
          TDMCP_RAG_EMBED_MODEL: bge-m3
        run: node scripts/run-vitest.mjs run tests/unit/creativeRag/ -t "embedding model"

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js 22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import knowledge base
        run: npm run import:bottobot

      - name: Test + coverage gate
        run: npm run test:coverage

  api-surface:
    name: Tool API Stability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js 22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the pinned tool API surface
        run: npm run api:check

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - unit-tests
      - build-package
      - bridge-tests
      - raw-exec-off-smoke
      - bridge-exec-off-smoke
      - creative-rag-multilingual-smoke
      - coverage
      - api-surface
    env:
      UNIT_TESTS: ${{ needs.unit-tests.result }}
      BUILD_PACKAGE: ${{ needs.build-package.result }}
      BRIDGE_TESTS: ${{ needs.bridge-tests.result }}
      RAW_EXEC_OFF_SMOKE: ${{ needs.raw-exec-off-smoke.result }}
      BRIDGE_EXEC_OFF_SMOKE: ${{ needs.bridge-exec-off-smoke.result }}
      CREATIVE_RAG_SMOKE: ${{ needs.creative-rag-multilingual-smoke.result }}
      COVERAGE: ${{ needs.coverage.result }}
      API_SURFACE: ${{ needs.api-surface.result }}
    steps:
      - name: Check required CI jobs
        run: |
          set -euo pipefail
          failed=0
          for item in \
            "unit-tests=${UNIT_TESTS}" \
            "build-package=${BUILD_PACKAGE}" \
            "bridge-tests=${BRIDGE_TESTS}" \
            "raw-exec-off-smoke=${RAW_EXEC_OFF_SMOKE}" \
            "bridge-exec-off-smoke=${BRIDGE_EXEC_OFF_SMOKE}" \
            "creative-rag-multilingual-smoke=${CREATIVE_RAG_SMOKE}" \
            "coverage=${COVERAGE}" \
            "api-surface=${API_SURFACE}"
          do
            name="${item%%=*}"
            result="${item#*=}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
