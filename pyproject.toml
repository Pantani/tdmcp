# Ruff config for the TouchDesigner bridge (`td/`).
#
# TouchDesigner embeds CPython 3.11, so the bridge must stay 3.11-compatible
# whatever Python the developer has locally; `target-version` keeps Ruff's
# suggestions inside that language level.
#
# `select` pins the rule set that was Ruff's default up to 0.15 (E4/E7/E9/F:
# undefined names, unused imports, syntax-level errors). Ruff 0.17 widened its
# default set (pyupgrade, bugbear, bandit, ...), which would turn a version bump
# into ~850 unrelated findings; adopting any of those families is a deliberate,
# separate cleanup. The `complexity:py` script (`ruff check td --select C901`)
# opts in to the McCabe check on the CLI and re-uses `max-complexity` below.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.mccabe]
max-complexity = 9
